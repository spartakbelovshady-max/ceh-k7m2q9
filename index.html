<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="none">
<meta name="theme-color" content="#16181A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Цех — помощник консультанта, отдел инструментов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2316181A'/><rect x='10' y='40' width='80' height='20' fill='%23F2C230'/><rect x='24' y='40' width='4' height='12' fill='%2316181A'/><rect x='40' y='40' width='4' height='20' fill='%2316181A'/><rect x='56' y='40' width='4' height='12' fill='%2316181A'/><rect x='72' y='40' width='4' height='20' fill='%2316181A'/></svg>">
<style>
:root{
  --ink:#16181A;
  --ink-2:#4A4F52;
  --ink-3:#7C8285;
  --concrete:#DFE2DC;
  --concrete-2:#CDD2CB;
  --card:#FBFBF9;
  --tape:#F2C230;
  --tape-dark:#C79A12;
  --alarm:#C4351F;
  --ok:#1F6B45;
  --line:#C3C8C1;
  --radius:2px;
  --display:"Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--concrete);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;line-height:1.45;
  padding-bottom:96px;
  overscroll-behavior-y:none;
}
h1,h2,h3,.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---- шапка ---- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#fff;
  border-bottom:4px solid var(--tape);
}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:720px;margin:0 auto}
.mark{font-family:var(--display);font-size:26px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.mark b{color:var(--tape)}
.hsub{font-family:var(--mono);font-size:10px;color:#9AA0A2;text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.hbtn{margin-left:auto;background:none;border:1px solid #3A3F42;color:#fff;font-family:var(--mono);font-size:11px;
  padding:8px 10px;border-radius:var(--radius);text-transform:uppercase;letter-spacing:.08em}

/* ---- вкладки ---- */
nav.tabs{display:flex;background:var(--ink);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto;width:100%}
.tab{
  flex:1 0 auto;background:none;border:0;color:#9AA0A2;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:15px;font-weight:700;
  padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap
}
.tab[aria-selected="true"]{color:var(--tape);border-bottom-color:var(--tape)}

/* ---- поиск ---- */
.search{display:flex;gap:8px;margin:14px 0 4px}
.search input{
  flex:1;font-family:var(--body);font-size:16px;padding:14px;
  border:2px solid var(--ink);border-radius:var(--radius);background:var(--card);color:var(--ink)
}
.search input:focus{outline:3px solid var(--tape);outline-offset:1px}

/* ---- карточки ---- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card{
  display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);
  border-radius:var(--radius);padding:14px;margin-bottom:8px;font:inherit;color:inherit;
}
.card:active{transform:translateY(1px)}
.card .ct{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.card .cd{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.card .aisle{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.card.hot{border-left-color:var(--tape)}
.card.ref{border-left-color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}

/* ---- лента-рулетка (прогресс) ---- */
.ruler{position:relative;height:44px;background:var(--tape);border:1px solid var(--tape-dark);border-radius:var(--radius);margin:14px 0 18px;overflow:hidden}
.ruler .ticks{position:absolute;inset:0;display:flex}
.ruler .tk{flex:1;position:relative;border-right:1px solid rgba(0,0,0,.25)}
.ruler .tk:last-child{border-right:0}
.ruler .tk span{position:absolute;left:4px;top:3px;font-family:var(--mono);font-size:10px;color:rgba(0,0,0,.55)}
.ruler .tk.done{background:var(--ink)}
.ruler .tk.done span{color:var(--tape)}
.ruler .tk.now{background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 6px,#2b2f31 6px,#2b2f31 12px)}
.ruler .tk.now span{color:var(--tape)}

/* ---- вопрос ---- */
.qwrap{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ink);padding:16px;border-radius:var(--radius)}
.qnum{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.qtitle{font-family:var(--display);font-size:23px;text-transform:uppercase;line-height:1.08;margin:6px 0 10px}
.qask{background:#16181A;color:#fff;padding:12px;border-radius:var(--radius);font-size:14.5px;margin-bottom:14px}
.qask b{color:var(--tape);display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;font-weight:400}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:var(--radius);
  padding:15px 14px;margin-bottom:8px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);position:relative}
.opt:active{background:var(--tape)}
.opt small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:3px}
.opt:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

/* ---- результат ---- */
.res-h{background:var(--ink);color:#fff;padding:16px;border-radius:var(--radius);border-bottom:5px solid var(--tape)}
.res-h .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tape);text-transform:uppercase}
.res-h h2{font-size:26px;margin-top:5px;line-height:1.05}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:8px}
.block h3{font-size:15px;letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px;display:flex;gap:8px;align-items:center}
.block h3::before{content:"";width:14px;height:3px;background:var(--tape);display:inline-block}
.block.warn{border-left:5px solid var(--alarm)}
.block.warn h3{color:var(--alarm)}
.block.warn h3::before{background:var(--alarm)}
.block.pick{border-left:5px solid var(--ok)}
.block.pick h3{color:var(--ok)}
.block.pick h3::before{background:var(--ok)}
.pickrow{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.pickrow:last-child{border:0;padding:0;margin:0}
.pickrow .pn{font-weight:700;font-size:17px}
.pickrow .pw{font-size:14.5px;color:var(--ink-2);margin-top:3px}
ul.tight{margin:0;padding-left:18px}
ul.tight li{margin-bottom:6px;font-size:14.5px}
ul.tight li b{font-family:var(--mono);font-size:13px;background:var(--concrete);padding:1px 4px;border-radius:2px}
.script{background:#16181A;color:#F3F3F1;padding:14px;border-radius:var(--radius);font-size:15px;line-height:1.5;border-left:5px solid var(--tape)}
.script .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tape);text-transform:uppercase;display:block;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;background:var(--concrete);border:1px solid var(--line);padding:6px 8px;border-radius:var(--radius)}
.answers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.answers .a{font-family:var(--mono);font-size:11px;background:#2b2f31;color:#cfd3d5;padding:5px 7px;border-radius:2px}

/* ---- кнопки ---- */
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:15px;border-radius:var(--radius);font-family:var(--display);text-transform:uppercase;
  letter-spacing:.06em;font-size:16px;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.btn.primary{background:var(--tape);border-color:var(--tape-dark)}
.btn.dark{background:var(--ink);color:#fff}
.back{background:none;border:0;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-2);padding:12px 0;display:inline-flex;align-items:center;gap:6px}

/* ---- аллеи ---- */
.aisle-row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px;margin-bottom:6px;border-radius:var(--radius)}
.aisle-row .nm{flex:1;font-size:14.5px;font-weight:600}
.aisle-row input{width:104px;font-family:var(--mono);font-size:15px;padding:9px;border:2px solid var(--ink);border-radius:var(--radius);text-align:center;background:#fff}
.note{background:#fff;border:1px dashed var(--ink-3);padding:12px;font-size:13.5px;color:var(--ink-2);border-radius:var(--radius)}
.saved{font-family:var(--mono);font-size:11px;color:var(--ok);text-transform:uppercase;letter-spacing:.1em;height:16px}
textarea{width:100%;min-height:120px;font:inherit;font-size:15px;padding:12px;border:2px solid var(--ink);border-radius:var(--radius);background:#fff}


#gate{position:fixed;inset:0;z-index:9999;background:var(--ink);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .g-mark{font-family:var(--display);font-size:44px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
#gate .g-mark b{color:var(--tape)}
#gate .g-sub{font-family:var(--mono);font-size:11px;color:#9AA0A2;text-transform:uppercase;letter-spacing:.14em;margin:8px 0 30px}
#gate input{width:200px;font-family:var(--mono);font-size:30px;letter-spacing:.4em;text-align:center;padding:14px;
  border:2px solid var(--tape);background:#1f2224;color:#fff;border-radius:2px}
#gate button{margin-top:14px;width:200px;padding:15px;border:0;background:var(--tape);color:#16181A;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:17px;font-weight:700;border-radius:2px}
#gate .g-err{color:#F08A78;font-family:var(--mono);font-size:12px;height:18px;margin-top:12px;text-transform:uppercase;letter-spacing:.08em}
#gate .g-note{font-family:var(--mono);font-size:10.5px;color:#6E7477;margin-top:32px;line-height:1.7;max-width:280px}

/* выбираемые позиции комплекта */
.chip.pickable{cursor:pointer;padding-left:24px;position:relative}
.chip.pickable::before{content:"";position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:11px;height:11px;border:2px solid var(--ink-3);border-radius:2px}
.chip.on{background:var(--tape);border-color:var(--tape-dark);font-weight:700}
.chip.on::before{background:var(--ink);border-color:var(--ink)}
li.pickable{cursor:pointer}
li.pickable.on{background:var(--tape);border-radius:2px;padding:2px 4px;margin-left:-4px}
/* нижняя панель комплекта */
#kitbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:4px solid var(--tape)}
#kitbar .kc{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.04em;flex:1}
#kitbar .kc b{color:var(--tape)}
#kitbar button{background:var(--tape);border:0;color:#16181A;font-family:var(--display);text-transform:uppercase;
  font-size:15px;font-weight:700;letter-spacing:.06em;padding:11px 14px;border-radius:2px}
#kitbar .clear{background:none;color:#9AA0A2;border:1px solid #3A3F42}
/* полноэкранные накладки */
.sheet{position:fixed;inset:0;z-index:200;background:var(--concrete);overflow-y:auto;padding:0 0 40px}
.sheet .sh-top{position:sticky;top:0;background:var(--ink);color:#fff;padding:14px;display:flex;align-items:center;
  gap:10px;border-bottom:4px solid var(--tape)}
.sheet .sh-top .t{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.05em;flex:1}
.sheet .sh-top button{background:var(--tape);border:0;color:#16181A;font-family:var(--display);font-size:15px;
  font-weight:700;text-transform:uppercase;padding:10px 14px;border-radius:2px;letter-spacing:.06em}
.sheet .sh-body{max-width:720px;margin:0 auto;padding:16px 14px}
/* режим показа клиенту — крупно */
.big h2{font-size:34px;line-height:1.02;margin-bottom:6px}
.big .bsub{font-family:var(--mono);font-size:14px;color:var(--ink-2);margin-bottom:20px}
.big .brow{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);
  padding:16px;margin-bottom:10px;border-radius:2px}
.big .brow .bn{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1.1;letter-spacing:.02em}
.big .brow .bw{font-size:17px;line-height:1.5;color:var(--ink);margin-top:8px}
.big .blist{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tape);padding:16px;border-radius:2px}
.big .blist li{font-size:18px;margin-bottom:9px}
/* быстрый выбор аллеи */
.aisle-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.aisle-pills button{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:14px 18px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;text-transform:uppercase}
.aisle-pills button.on{background:var(--tape);border-color:var(--tape-dark)}
.aisle-pills button.dep{font-size:15px}

.calcbox{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tape);padding:14px;margin-bottom:10px;border-radius:2px}
.calcbox h3{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.calcbox .cdesc{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.calcbox label{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.calcbox label:last-of-type{border:0}
.calcbox input[type=checkbox]{width:22px;height:22px;accent-color:var(--tape);flex:none}
.calcbox select,.calcbox input[type=number]{font:inherit;font-size:16px;padding:11px;border:2px solid var(--ink);
  border-radius:2px;background:#fff;width:100%;margin-bottom:8px}
.calcout{background:var(--ink);color:#fff;padding:13px;border-radius:2px;margin-top:12px;font-size:15px;line-height:1.5}
.calcout b{color:var(--tape);font-family:var(--mono);font-size:17px}
.calcout .cn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9AA0A2;display:block;margin-bottom:6px}
.caseform input,.caseform textarea{width:100%;font:inherit;font-size:15px;padding:11px;border:2px solid var(--ink);
  border-radius:2px;background:#fff;margin-bottom:8px}
.caseform textarea{min-height:80px}
.casecard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);padding:13px;margin-bottom:8px;border-radius:2px}
.casecard .cn{font-weight:700;font-size:16px}
.casecard .cs{font-size:14px;color:var(--ink-2);margin-top:5px}
.casecard .cr{font-size:14.5px;margin-top:7px}
.casecard .del{background:none;border:1px solid var(--line);color:var(--ink-3);font-family:var(--mono);
  font-size:11px;padding:6px 9px;border-radius:2px;margin-top:9px;text-transform:uppercase;letter-spacing:.08em}

.must{background:#16181A;color:#fff;border-radius:2px;padding:15px;margin-top:8px;border-left:5px solid var(--tape)}
.must h3{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.09em;color:var(--tape);margin-bottom:12px}
.must .m{border-bottom:1px dashed #3A3F42;padding-bottom:11px;margin-bottom:11px;cursor:pointer;position:relative;padding-left:30px}
.must .m:last-child{border:0;padding-bottom:0;margin-bottom:0}
.must .m::before{content:"";position:absolute;left:0;top:3px;width:15px;height:15px;border:2px solid #6E7477;border-radius:2px}
.must .m.on::before{background:var(--tape);border-color:var(--tape)}
.must .mn{font-weight:700;font-size:16.5px}
.must .mw{font-size:14px;color:#C8CCCE;margin-top:5px;line-height:1.5}
.must .mw b{color:var(--tape);font-weight:700}

.closing{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);padding:14px;margin-top:8px;border-radius:2px}
.closing h3{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--ok);margin-bottom:11px}
.closing .ci{padding:10px 0 10px 30px;border-bottom:1px dashed var(--line);position:relative;cursor:pointer}
.closing .ci:last-child{border:0}
.closing .ci::before{content:"";position:absolute;left:0;top:12px;width:15px;height:15px;border:2px solid var(--ink-3);border-radius:2px}
.closing .ci.on::before{background:var(--ok);border-color:var(--ok)}
.closing .ci.on .cin{text-decoration:line-through;color:var(--ink-3)}
.closing .cin{font-weight:700;font-size:15.5px}
.closing .ciw{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.shortbtn{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:9px 12px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px}
.shortbtn.on{background:var(--tape);border-color:var(--tape-dark);font-weight:700}
.verbox{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);
  padding:12px;border-radius:2px;line-height:1.7}
.verbox .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.lm{font-family:var(--mono);font-size:14px;background:var(--ink);color:var(--tape);padding:3px 7px;border-radius:2px;letter-spacing:.06em}
.minibtn{display:inline-block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;text-decoration:none}
.minibtn.del{color:var(--ink-3)}
.codecard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tape);padding:12px;margin-bottom:7px;border-radius:2px}

.aislecard{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-left:5px solid var(--tape);border-radius:2px;margin-bottom:8px;padding:0;font:inherit;color:inherit}
.aislecard:active{transform:translateY(1px)}
.aislecard .an{flex:0 0 74px;background:var(--ink);color:var(--tape);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:34px;letter-spacing:.02em}
.aislecard .an:empty{display:none}
.aislecard .ab{padding:13px 14px;flex:1;min-width:0}
.aislecard .at{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.aislecard .ad{font-size:13px;color:var(--ink-2);margin-top:5px;overflow:hidden}
.aislecard .ac{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}

.shelfrow{display:flex;gap:8px;align-items:center;margin:6px 0 12px}
.shelfrow input{flex:1;font:inherit;font-size:14px;padding:9px 10px;border:1px dashed var(--ink-3);
  border-radius:2px;background:#fff;color:var(--ink)}
.shelfrow input:focus{border-style:solid;border-color:var(--ink);outline:2px solid var(--tape)}
.shelfrow .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:none}
.qa{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);padding:12px;margin-bottom:7px;border-radius:2px}
.qa .qq{font-weight:700;font-size:15px}

const siteSearch = q => SITE + "/search/?q=" + encodeURIComponent(q);

/* Умная ссылка: подставляем в поиск то, что реально посчитали */
function siteSmart(f, r){
  const clean = s => String(s||"").replace(/<[^>]+>/g,"")
    .replace(/[·•]/g," ").replace(/\s+/g," ").trim();
  /* берём только первый смысловой кусок заголовка — поиск на сайте не любит длинные фразы */
  /* база = заголовок без хвоста после запятой, если хвост дублирует цифры */
  let base = clean(r.head).split(/[:(]/)[0].trim();
  const cut = base.search(/,(?!\d)/);
  if(cut>0) base = base.slice(0,cut).trim();
  base = base.split(" ").slice(0,4).join(" ");
  const specs = (clean(r.head)+" "+clean(r.sub))
    .match(/[\d]+([.,][\d]+)?\s?(кВт|Вт|л\/мин|л\/ч|бар|мм|А|Дж|Нм|В)/gi) || [];
  const norm = s => s.toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  const inBase = norm(base);
  const uniq = [];
  specs.forEach(s=>{ const v=s.replace(/\s+/g,"");
    const digits = v.replace(/[^\d]/g,"");
    if(uniq.indexOf(v)<0 && inBase.indexOf(norm(v))<0
       && !(digits && inBase.replace(/[^\d]/g,"").indexOf(digits)>=0)) uniq.push(v); });
  let q = (base + " " + uniq.slice(0,2).join(" ")).trim();
  if(q.replace(/\s/g,"").length < 5) q = f.site || f.title;
  return siteSearch(q);
}

function codesFor(flowId, head){

  return getCodes().filter(c => c.k===k || (c.all && c.f===flowId));

  try{ obj=JSON.parse(decodeURIComponent(escape(atob(raw)))); }
  catch(e){ try{ obj=JSON.parse(raw); }catch(e2){ return false; } }
  if(!obj || typeof obj!=="object") return false;
  if(obj.aisle) Object.keys(obj.aisle).forEach(z=>store.set("aisle:"+z,obj.aisle[z]));
  if(obj.shelf) Object.keys(obj.shelf).forEach(z=>store.set("shelf:"+z,obj.shelf[z]));
  if(obj.notes) store.set("notes",obj.notes);
  if(Array.isArray(obj.codes)){
    const cur=getCodes(), ids=new Set(cur.map(c=>c.id));
    obj.codes.forEach(c=>{ if(!ids.has(c.id)) cur.push(c); });
    setCodes(cur);
  }
  if(Array.isArray(obj.cases)){
    const cur=getCases(), keys=new Set(cur.map(c=>c.t));

    setCases(cur);
  }
  return true;
}

/* Если для категории нет своего списка — берём первые позиции расходки и СИЗ */
function must3For(id, r){
  if(MUST3[id]) return MUST3[id];
  const out=[];
  (r.addons||[]).slice(0,2).forEach(x=>out.push([x,"Без этого инструмент не начнёт работать — предложите сразу, а не вдогонку."]));
  if(r.siz && r.siz[0]) out.push([r.siz[0].replace(/<[^>]+>/g,""),"Защита. Люди почти никогда не берут её сами — назовите вслух."]);
  return out.slice(0,3);
}

function slangHit(q){
  const s=q.trim().toLowerCase();
  let v = SLANG[s];
  if(v===undefined){
    const k=Object.keys(SLANG).find(w=>s.includes(w));
    v = k?SLANG[k]:null;
  }
  if(!v) return [];
  return (Array.isArray(v)?v:[v]).filter(id=>FLOWS[id]);
}

   opts:[["Бетон, кирпич, камень","stone"],["Дерево, ДСП, фанера","wood"],["Металл","metal"],["Гипсокартон, блок, пустотелое","hollow"],["Плитка, стекло, керамика","tile"],["Клиент не знает материал","unknown"]]},
  {q:"Третий вопрос — масштаб",
   ask:"«Это один раз или впереди много такой работы?» Здесь же уточните срок: если делать сегодня — важно наличие, а не идеальный вариант.",
   opts:[["Один раз, по мелочи","once"],["Ремонт, надолго","reno"],["Работа, постоянно","pro"]]}
 ],
 out(a){
  const [task,mat,vol]=a;
  const picks=[];
  const to = (id,why) => { if(FLOWS[id]) picks.push(["→ "+FLOWS[id].title+" · "+aisleTag(FLOWS[id].zone), why]); };

  if(task==="fog"){
   picks.push(["Смените тип вопроса","Человек не может ответить на «что вам нужно», потому что не знает слов. Спросите иначе: <b>«Покажите фото» · «Что вы делали вчера с этим?» · «Что должно получиться, когда закончите?»</b> Три варианта, любой сработает лучше прямого вопроса."]);
   picks.push(["Дайте выбор из двух, а не открытый вопрос","Открытый вопрос парализует. Закрытый двигает: «Это чтобы что-то держало или чтобы что-то разрезать?» Дальше сужайте так же, парами."]);
   picks.push(["Ведите к предмету, а не к категории","«Пойдёмте покажу, тут проще ткнуть пальцем». У стеллажа человек вспоминает нужное слово за секунды — это работает почти всегда."]);
  }

  if(task==="hold"){
   if(mat==="hollow") to("krepez","Пустотелое основание — распорный дюбель не держит. Это ключевая развилка, спросите про звук при простукивании.");
   else if(mat==="stone") to("krepez","Бетон и кирпич: подбор идёт от веса и от того, есть ли рывковая нагрузка.");
   else if(mat==="wood") to("skobyanka","Дерево — это уголки, пластины, глухари. Отдел скобянки.");
   else to("krepez","Начните с основания: без него крепёж не подобрать.");
   if(mat!=="wood") to("perf","Под крепёж почти всегда нужно отверстие — сразу уточните, есть ли чем сверлить.");
  }

  if(task==="cut"){
   if(mat==="metal"){ to("ushm","Резать металл: болгарка под большинство задач."); to("montaz","Если труба или профиль в размер — монтажная пила даёт ровный рез."); }
   else if(mat==="wood"){ to("cirkulyarka","Прямой длинный рез по листу и доске."); to("lobzik","Фигурный рез и рез по месту."); to("sabelnaya","Демонтаж и ветки."); }
   else if(mat==="tile") to("plitka","Плитка и керамогранит: ручной или электрический плиткорез плюс подрезка.");
   else if(mat==="stone") to("ushm","Камень и бетон — алмазный диск, обязательно пылеудаление и респиратор.");
   else picks.push(["Сначала выясните материал","От металла до плитки — три разных инструмента. Без материала подбирать нельзя, это будет угадывание."]);
  }

  if(task==="flat"){
   to("laser","Разметка по плоскости и уровню.");
   to("pravilo","Если речь про штукатурку и стяжку.");
   to("izmerenie","Если нужно измерить, а не выровнять.");
  }

  if(task==="join"){
   if(mat==="metal") to("svarka","Металл наглухо — сварка. Уточните толщину, от неё зависит всё.");
   else if(mat==="wood"){ to("shurup","Дерево — саморезы и шуруповёрт."); to("skobyanka","Уголки и пластины для узлов."); }
   else to("krepez","Уточните, что с чем соединяется — от этого зависит и крепёж, и инструмент.");
  }

  if(task==="clean"){
   to("moyka","Улица, машина, двор, фасад.");
   to("shlif","Снять старую краску, ржавчину, выровнять поверхность.");
   to("pylesos","Убрать пыль и мусор после работ.");
  }

  if(task==="hole"){
   if(mat==="stone") to("perf","Бетон и кирпич — перфоратор, дальше по диаметру и количеству.");
   else if(mat==="tile") to("perf","Плитка — без удара, отдельная ветка внутри.");
   else if(mat==="metal"||mat==="wood") to("shurup","Дерево и металл — дрель или шуруповёрт, вопрос в свёрлах.");
   else to("perf","Начните с основания.");
  }

  if(mat==="unknown") picks.push(["Материал неизвестен — не гадайте",
   "Три способа выяснить: <b>простучать</b> (глухо — полнотелое, гулко — пустота), <b>магнит</b> (ловит саморезы в профиле под гипсокартоном), <b>фото</b>. Продать крепёж вслепую — это возврат."]);

  if(vol==="once") picks.push(["Масштаб маленький — не грузите выбором",
   "Один раз и по мелочи: предложите один вариант, а не три. Избыток вариантов у неопределившегося человека вызывает «я подумаю» и уход."]);
  if(vol==="pro") picks.push(["Работа постоянная — можно углубляться",
   "Здесь человек оценит подробности и цифры. Он вернётся ещё не раз, вкладывайтесь в разговор."]);

  picks.push(["Проверьте себя перед тем, как вести к полке",
   "Скажите вслух: <b>«Правильно понимаю: вам нужно [работа] по [материал], один раз. Верно?»</b> Если клиент кивнул — ведите. Если поправил — вы только что сэкономили себе двадцать минут и возврат."]);

  return {
   head:"Разбор неясного запроса",
   sub:({hold:"закрепить",cut:"разделить",flat:"выровнять",join:"соединить",clean:"очистить",hole:"отверстие",fog:"полный туман"})[task],
   picks,
   params:[
    ["Не спрашивайте «что вам нужно»","Человек не знает слов и назовёт инструмент неправильно. Спрашивайте про работу и про результат."],
    ["Закрытые вопросы вместо открытых","«Это держать или резать?» двигает разговор. «Что вы хотите?» ставит в тупик."],
    ["Материал решает больше половины","Одна и та же задача на бетоне и на газоблоке — разные товары."],
    ["Фото и простукивание","Два бесплатных способа снять неопределённость за десять секунд."],
    ["Ведите к полке","У стеллажа человек вспоминает нужное слово. Разговор в проходе может длиться вечно."],
    ["Проверочный повтор","Проговорите задачу своими словами и дождитесь подтверждения."]
   ],
   addons:["Ничего не подбирайте, пока не подтвердили задачу"],
   siz:["Если задача окажется опасной — резка, сварка, пыль — СИЗ называем сразу, не в конце"],
   up:["Допродажу предлагайте только после того, как задача подтверждена"],
   errors:[
    "Начинают предлагать товар до того, как поняли задачу. Клиент уходит с не тем и возвращается недовольным.",
    "Задают открытые вопросы неопределившемуся человеку.",
    "Показывают три варианта тому, кто не может выбрать из одного.",
    "Верят названию, которое произнёс клиент: «дрель» часто означает перфоратор, «керхер» — любую мойку.",
    "Стесняются попросить фото. Это самый быстрый способ всё выяснить.",
    "Уходят думать за клиента и предлагают то, что интересно самому продавцу."
   ],
   script:"«Давайте зайду с другой стороны. Не важно, как это называется — расскажите, что вы делаете и что должно получиться. А ещё лучше покажите фото, если есть. По фото я подберу точно, а по названию мы можем оба ошибиться.»"
  };
 }
},

function posLine(id){
  const p = SHELF_POS[id]; if(!p) return "";
  const parts=[];
  if(p.tool) parts.push("Инструмент: "+p.tool);
  if(p.osn)  parts.push(p.osn);
  return (p.a? "Аллея "+p.a+" · " : "") + parts.join(" · ");
}

/* ---------- список инструментов ---------- */
function flowCard(k){
  const f=FLOWS[k];
  return `<button class="card hot" data-flow="${k}">
    <div class="ct">${esc(f.title)}</div>
    <div class="cd">${esc(f.desc)}</div>
    <div class="aisle">${esc(aisleTag(f.zone))}</div>${posLine(k)?`<div class="posline dark">${esc(posLine(k))}</div>`:""}${shelf(f.zone)?`<div class="shelfnote">${esc(shelf(f.zone))}</div>`:""}
  </button>`;
}

const HELPER_ZONE = "Помощь в разговоре";
function helperFlows(){ return Object.keys(FLOWS).filter(k=>FLOWS[k].zone===HELPER_ZONE); }
function aisleGroups(){
  const g={};
  Object.keys(FLOWS).forEach(k=>{
    if(FLOWS[k].zone===HELPER_ZONE) return;
    const z=FLOWS[k].zone, a=aisle(z)||"Без аллеи";
    g[a]=g[a]||{}; (g[a][z]=g[a][z]||[]).push(k);
  });
  return g;
}
function aisleOrder(keys){
  return keys.sort((a,b)=>{
    const na=/^\d+$/.test(a), nb=/^\d+$/.test(b);
    if(na&&nb) return (+a)-(+b);
    if(na) return -1; if(nb) return 1;
    if(a==="Без аллеи") return 1; if(b==="Без аллеи") return -1;
    return a.localeCompare(b,"ru");
  });
}

function resultsHTML(){
  const q = S.q.trim().toLowerCase();
  let h = "";

  if(!q){
    const G = aisleGroups();

    /* ---- экран помощи ---- */
    if(S.aisle === "__help__"){
      const sn = seasonNow();
      h += `<button class="back" id="aisleBack">← Все аллеи</button>
        <div class="eyebrow">Если запрос непонятен</div>` + helperFlows().map(k=>flowCard(k)).join("")
        + `<div class="eyebrow">Сейчас в зале</div>
        <div class="block pick"><h3>${esc(sn.t)}</h3>
          <div style="font-size:14.5px;color:var(--ink-2);margin-bottom:10px">${esc(sn.txt)}</div>
          ${sn.ids.filter(id=>FLOWS[id]).map(id=>flowCard(id)).join("")}</div>`;
      const tu = topUsed(5);
      if(tu.length>=3) h += `<div class="eyebrow">Чаще всего у вас</div>` + tu.map(k=>flowCard(k)).join("");
      return h;
    }

    /* ---- уровень 2: выбрана аллея ---- */
    if(S.aisle && G[S.aisle]){
      const zones = Object.keys(G[S.aisle]).sort((a,b)=>a.localeCompare(b,"ru"));
      const cont = AISLE_CONTENT[S.aisle];
      const isNum = /^\d+$/.test(S.aisle);
      h += `<button class="back" id="aisleBack">← Все аллеи</button>
        <div class="res-h"><div class="rl">${isNum?"Аллея":"Отдел"}</div><h2>${esc(S.aisle)}</h2>
          <div style="font-family:var(--mono);font-size:12px;color:#B9BEC0;margin-top:6px">
            ${zones.length} направлени${zones.length===1?"е":"й"} · ${Object.values(G[S.aisle]).reduce((n,v)=>n+v.length,0)} категорий</div></div>`;
      const sm = SHELF_MAP[S.aisle];
      if(sm) h += `<div class="block"><h3>Карта аллеи по метрам</h3>
        <div class="map2">
          <div class="mapcol"><div class="mh">Слева</div>
            ${sm.L.map(x=>`<div class="mr"><span class="mp">${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join("")}</div>
          <div class="mapcol"><div class="mh">Справа</div>
            ${sm.R.map(x=>`<div class="mr"><span class="mp">${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join("")}</div>
        </div>
        <div class="note" style="margin-top:10px;font-size:12.5px">L — левая сторона прохода, R — правая. Цифра это номер метра от начала аллеи.</div></div>`;
      if(cont) h += `<div class="block"><h3>Что здесь лежит</h3>
        <div class="chips">${cont.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`;
      const top = (AISLE_TOP[S.aisle]||[]).filter(id=>FLOWS[id]);
      const used = topUsed(20).filter(id=>aisle(FLOWS[id].zone)===S.aisle);
      const merged = used.concat(top.filter(id=>used.indexOf(id)<0)).slice(0,10);
      if(merged.length>=3){
        h += `<div class="eyebrow">Топ запросов в этой аллее</div>` + merged.map(k=>flowCard(k)).join("");
      }

      h += `<div class="eyebrow" style="margin-top:22px">Все направления</div>`;
      zones.forEach(z=>{
        h += `<div class="eyebrow">${esc(z)}</div>
          <div class="shelfrow"><span class="lbl">Где</span>
            <input data-shelf="${esc(z)}" value="${esc(shelf(z))}" placeholder="Например: правая сторона, вторая полка сверху"></div>`
          + G[S.aisle][z].map(k=>flowCard(k)).join("");
      });
      return h;
    }

    /* ---- уровень 1: только аллеи ---- */
    h += `<div class="eyebrow">Куда идём</div>`;
    aisleOrder(Object.keys(G)).forEach(a=>{
      const zones=Object.keys(G[a]);
      const cnt=zones.reduce((n,z)=>n+G[a][z].length,0);
      const isNum=/^\d+$/.test(a);
      h += `<button class="aislecard" data-openaisle="${esc(a)}">
        <div class="an">${isNum?a:""}</div>
        <div class="ab">
          <div class="at">${isNum?"Аллея "+esc(a):esc(a)}</div>
          <div class="ad">${esc(zones.slice(0,3).join(" · "))}${zones.length>3?" и ещё "+(zones.length-3):""}</div>
          <div class="ac">${cnt} категор${cnt%10===1&&cnt%100!==11?"ия":"ий"}</div>
        </div></button>`;
    });
    h += `<button class="aislecard" data-openaisle="__help__" style="border-left-color:var(--alarm)">
        <div class="ab">
          <div class="at">Запрос непонятен</div>
          <div class="ad">Клиент не знает, что хочет · совместимость · сезон</div>
          <div class="ac">Помощь в разговоре</div>
        </div></button>`;
    return h;
  }

  /* ---- поиск ---- */
  const sl = slangHit(q);
  if(sl.length){
    h += `<div class="eyebrow">Клиент сказал так — значит нужен${sl.length>1?" (уточните, что именно)":""}</div>`
       + sl.map(id=>flowCard(id)).join("");
  }
  const words = q.split(/\s+/).filter(Boolean);
  const hit = txt => { const t=txt.toLowerCase(); return words.every(w=>t.includes(w)); };
  const keys = Object.keys(FLOWS).filter(k=>{ const f=FLOWS[k]; return hit(f.title+" "+f.desc+" "+f.tags+" "+f.zone); });
  const refs = REF.filter(r=>hit(r.t+" "+r.tags));
  const kits = KITS.filter(r=>hit(r.t+" "+r.tags));
  const cases = getCases().filter(c=>hit(c.t+" "+c.r));
  const qas = QUICK.filter(x=>hit(x[0]+" "+x[1])).slice(0,4);
  if(qas.length){ h+=`<div class="eyebrow">Короткий ответ</div>`;
    qas.forEach(x=>h+=`<div class="qa"><div class="qq">${esc(x[0])}</div><div class="qan">${esc(x[1])}</div></div>`); }
  if(cases.length){ h+=`<div class="eyebrow">Кейсы отдела</div>`;
    cases.forEach(c=>h+=`<div class="casecard"><div class="cn">${esc(c.t)}</div><div class="cr">${esc(c.r)}</div></div>`); }
  if(!keys.length && !refs.length && !kits.length && !cases.length && !qas.length)
    h += `<div class="note" style="margin-top:14px">Ничего не нашлось. Попробуйте другое слово: «бетон», «крепёж», «воздух», «резать», «шлифовать», «замер», «смазка».</div>`;
  keys.forEach(k=>h+=flowCard(k));
  if(refs.length){ h+=`<div class="eyebrow">Шпаргалки</div>`;
    refs.forEach(r=>h+=`<button class="card ref" data-ref="${r.id}"><div class="ct">${esc(r.t)}</div></button>`); }
  if(kits.length){ h+=`<div class="eyebrow">Наборы</div>`;
    kits.forEach(r=>h+=`<button class="card ref" data-kit="${KITS.indexOf(r)}"><div class="ct">${esc(r.t)}</div><div class="cd">${esc(r.hint)}</div></button>`); }
  h += `<div style="margin-top:14px"><a class="card ref" style="text-decoration:none" href="${siteSearch(S.q)}" target="_blank" rel="noopener">
    <div class="ct">Найти на сайте Лемана ПРО</div>
    <div class="cd">Открыть поиск «${esc(S.q)}» на saransk.lemanapro.ru</div></a></div>`;
  return h;
}

/* ---------- вопрос ---------- */
function viewQuestion(){
  const f = FLOWS[S.flow], total=f.qs.length, cur=f.qs[S.step];
  let ticks="";
  for(let i=0;i<total;i++){
    const cl = i<S.step?"done":(i===S.step?"now":"");
    ticks += `<div class="tk ${cl}"><span>${i+1}</span></div>`;
  }
  return `<button class="back" id="back">← ${S.step===0?"К списку":"Назад"}</button>
  <div class="ruler"><div class="ticks">${ticks}</div></div>
  <div class="qwrap view">
    <div class="qnum">${esc(f.title)} · вопрос ${S.step+1} из ${total}</div>
    <div class="qtitle">${esc(cur.q)}</div>
    <div class="qask"><b>Спросите клиента</b>${esc(cur.ask)}</div>
    ${cur.opts.map((o,i)=>`<button class="opt" data-pick="${i}">${esc(o[0])}</button>`).join("")}
  </div>`;
}

  list.forEach((x,i)=>{ const g=x[x.length-1]; (groups[g]=groups[g]||[]).push([x,i]); });
  return Object.keys(groups).map(g=>
    `<div style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px">${esc(g)}</div>`

  ).join("");
}

function wireCalc(){
  const num=id=>parseFloat((document.getElementById(id)||{}).value);
  const val=id=>(document.getElementById(id)||{}).value;

  const air=()=>{
    let s=0,n=0,names=[];
    app.querySelectorAll("[data-air]").forEach(c=>{ if(c.checked){ s+=AIR[+c.dataset.air][1]; n++; names.push(AIR[+c.dataset.air][0]); } });
    const el=document.getElementById("airOut"); if(!el) return;
    if(!n){ el.innerHTML='<span class="cn">Результат</span>Отметьте инструменты'; return; }
    const sim=+val("airSim")||1;
    const need=Math.round(s*1.3*sim/10)*10;
    const tank = need<180?"24–50 л":(need<300?"50 л":(need<500?"50–100 л":"100 л и больше"));
    const drive = need>=350 ? "ременной привод" : "коаксиальный подойдёт";
    el.innerHTML=`<span class="cn">Нужен компрессор</span>Производительность от <b>${need} л/мин</b><br>
      Ресивер ${tank} · ${drive}<br>
      <span style="font-size:13px;color:#B9BEC0">Сумма по инструментам ${s} л/мин${sim>1?" × 2 человека":""} плюс 30% запаса.
      ${need>=350?"При такой нагрузке коаксиальный привод уйдёт в перегрев — нужен ременной.":""}</span>`;
  };

  const watt=()=>{
    let run=0,peak=0,peakAll=0,n=0;
    app.querySelectorAll("[data-watt]").forEach(c=>{ if(c.checked){ const w=WATT[+c.dataset.watt];
      run+=w[1]; peak=Math.max(peak, w[1]*w[2]); peakAll += w[1]*w[2]; n++; } });
    const el=document.getElementById("wattOut"); if(!el) return;
    if(!n){ el.innerHTML='<span class="cn">Результат</span>Отметьте потребителей'; return; }
    const mode=val("wattMode");
    const total = mode==="all" ? peakAll : Math.max(run - peak/ (peak?1:1) + peak, peak, run);
    const kw=Math.ceil(total/500)*500/1000;
    const fuel=(kw*0.35).toFixed(1);
    const welding = ["Сварочный инвертор 160 А","Сварочный инвертор 200 А"].some((nm,i)=>{
      return Array.from(app.querySelectorAll("[data-watt]")).some(c=>c.checked && WATT[+c.dataset.watt][0]===nm); });
    el.innerHTML=`<span class="cn">Нужен генератор</span>Мощность от <b>${kw.toFixed(1)} кВт</b><br>
      Рабочая нагрузка ${run} Вт · пик при запуске ${Math.round(mode==="all"?peakAll:peak)} Вт<br>
      Расход топлива ориентировочно ${fuel} л/час под нагрузкой<br>
      <span style="font-size:13px;color:#B9BEC0">
      ${mode==="all"?"Считаем худший случай — всё стартует разом. Обычно так не бывает, но для насосов и холодильника запас нужен.":"Пик считается по самому тяжёлому мотору."}
      ${welding?" <b>Со сваркой в списке инверторный генератор не подойдёт — только обычный.</b>":""}
      ${kw>=5?" От 5 кВт смотрите модели с электростартом — ручной запуск тяжёлый.":""}</span>`;
  };

  const amp=()=>{
    const w=num("ampW"), L=+val("ampL");
    const el=document.getElementById("ampOut"); if(!el) return;
    if(!w){ el.innerHTML='<span class="cn">Результат</span>Введите мощность'; return; }
    const I=w/220;
    let base=CABLE.find(c=>c[1]>=I);
    if(!base) base=CABLE[CABLE.length-1];
    let idx=CABLE.indexOf(base);
    if(L>=25) idx=Math.min(idx+1,CABLE.length-1);
    if(L>=50) idx=Math.min(idx+1,CABLE.length-1);
    const pick=CABLE[idx];
    el.innerHTML=`<span class="cn">Кабель и удлинитель</span>Сечение не меньше <b>${pick[0]} мм²</b><br>
      Ток нагрузки около ${I.toFixed(1)} А · длина до ${L} м<br>
      <span style="font-size:13px;color:#B9BEC0">На длине больше 25 метров сечение берут с запасом — иначе падает напряжение.
      И удлинитель на катушке всегда разматывайте полностью: свёрнутый в бухту греется.</span>`;
  };

  const rule=()=>{
    const v=num("stepIn");
    const el=document.getElementById("ruleOut"); if(!el) return;
    if(!v||v<20){ el.innerHTML='<span class="cn">Результат</span>Введите шаг маяков'; return; }
    const min=v+40;
    const len = min<=150?"1,5 м":(min<=200?"2 м":(min<=250?"2,5 м":"3 м"));
    el.innerHTML=`<span class="cn">Правило</span>Берём <b>${len}</b><br>
      Минимум ${Math.round(min)} см: шаг ${v} см плюс 40 см опоры<br>
      <span style="font-size:13px;color:#B9BEC0">Плюс короткое 1 м на откосы и углы — им работают почти столько же.</span>`;
  };

  const glue=()=>{
    const a=num("areaIn"), sz=val("sizeIn");
    const el=document.getElementById("glueOut"); if(!el) return;
    if(!a){ el.innerHTML='<span class="cn">Результат</span>Введите площадь'; return; }
    const zub={"15":"6","30":"8","60":"10","120":"12"}[sz];
    const kg=a*GLUE[zub], bags=Math.ceil(kg/25);
    const zat=(a*0.5).toFixed(1);
    const krest=Math.ceil(a*{"15":25,"30":12,"60":5,"120":3}[sz]);
    el.innerHTML=`<span class="cn">На ${a} м²</span>Клей: <b>${Math.round(kg)} кг</b> — ${bags} мешк${bags===1?"":"а"} по 25 кг<br>
      Гребёнка с зубом <b>${zub} мм</b><br>
      Затирка примерно ${zat} кг · крестики или СВП около ${krest} шт<br>
      <span style="font-size:13px;color:#B9BEC0">Расход клея при зубе ${zub} мм — ${GLUE[zub]} кг на м². На кривом основании уйдёт больше: берите с запасом на мешок.
      ${sz==="120"?"Крупноформат промазывают и с обратной стороны — расход вырастет ещё примерно на треть.":""}</span>`;
  };

  const paint=()=>{
    const a=num("pArea"), t=val("pType"), l=+val("pLayer");
    const el=document.getElementById("pOut"); if(!el) return;
    if(!a){ el.innerHTML='<span class="cn">Результат</span>Введите площадь'; return; }
    const q=a*PAINT[t]*l;
    el.innerHTML=`<span class="cn">${esc(t)}</span>Нужно около <b>${q.toFixed(1)} кг</b> на ${l} слой${l>1?"я":""}<br>
      <span style="font-size:13px;color:#B9BEC0">Расход ${PAINT[t]} на м² за слой. На пористом и неровном основании смело прибавляйте четверть.
      Первый слой на голую штукатурку всегда уходит быстрее.</span>`;
  };

  const kras=()=>{
    const t=val("kType"), p=val("kPnev"), a=num("kArea");
    const el=document.getElementById("kOut"); if(!el) return;
    /* [сопло, расход воздуха для пневмо, расход материала кг/м² за слой, производительность мл/мин] */
    const M={lak:["1,2–1,4 мм",280,0.10,250],
             emal:["1,4–1,8 мм",300,0.13,300],
             grunt:["1,8 мм",350,0.18,350],
             vodo:["2,0–2,6 мм",400,0.17,450],
             gusto:["2,6–3,0 мм",450,0.35,550]}[t];
    let block="";
    if(p==="el"){
      block=`Производительность аппарата от <b>${M[3]} мл/мин</b><br>Компрессор не нужен — мотор внутри<br>`;
      if(a){
        const min=Math.ceil((a*M[2]*1000*2)/M[3]);
        block+=`Чистое время на ${a} м² в два слоя: около <b>${min} мин</b> распыления<br>`;
      }
    } else {
      const need=Math.round(M[1]*1.3/10)*10;
      block=`Расход воздуха около <b>${M[1]} л/мин</b><br>Компрессор от <b>${need} л/мин</b>, ресивер от 50 л<br>`;
    }
    let paint="";
    if(a){ const kg=(a*M[2]*2).toFixed(1); paint=`Материала на ${a} м² в два слоя: примерно <b>${kg} кг</b><br>`; }
    el.innerHTML=`<span class="cn">Краскопульт</span>Сопло <b>${M[0]}</b><br>${block}${paint}
      <span style="font-size:13px;color:#B9BEC0">
      ${p==="el"?"У сетевых главная цифра — миллилитры в минуту, а не ватты. Ватты про мотор, мл/мин про скорость работы. Время выше — чистое распыление, без подготовки и подрезки углов."
               :"Краскопульт — самый прожорливый пневмоинструмент. Обязателен фильтр-влагоотделитель: вода из ресивера даёт кратеры."}
      Краску разводят по вискозиметру — почти все жалобы «плюётся» именно от вязкости.</span>`;
  };

  const el_=()=>{
    const d=parseFloat(val("elIn")), L=num("elLen");
    const el=document.getElementById("elOut"); if(!el) return;
    let extra="";
    if(L){
      const perM = d<=2.5?12:(d===3?9:(d===4?6:4));
      const total=Math.ceil(perM*L);
      const kg=(total*{2:0.02,2.5:0.03,3:0.05,4:0.09,5:0.14}[d]).toFixed(1);
      extra=`<br>На ${L} м шва: примерно <b>${total} электродов</b> (около ${kg} кг)`;
    }
    el.innerHTML=`<span class="cn">Сварочный ток</span><b>${Math.round(d*30)}–${Math.round(d*40)} А</b>${extra}<br>
      <span style="font-size:13px;color:#B9BEC0">Низ диапазона — тонкий металл и потолочный шов, верх — толстый металл в нижнем положении.
      Расход электродов считаем на один проход, на многослойный шов умножайте.</span>`;
  };

  const ushm=()=>{
    const d=parseFloat(val("ushmIn"));
    const el=document.getElementById("ushmOut"); if(!el) return;
    const map={115:30,125:33,150:40,180:55,230:70};
    const w={115:"от 750 Вт",125:"от 900 Вт",150:"от 1300 Вт",180:"от 1600 Вт",230:"от 2000 Вт"};
    el.innerHTML=`<span class="cn">Круг ${d} мм</span>Глубина реза около <b>${map[d]} мм</b> за проход<br>
      Мощность машины ${w[d]}<br>
      <span style="font-size:13px;color:#B9BEC0">По мере износа круга глубина падает. Нужно глубже — это другой диаметр машины, а не другой круг.
      ${d>=180?"Машина двуручная, обязательны плавный пуск и защита от заклинивания.":""}</span>`;
  };

  const moyka=()=>{
    const v=val("mArea");
    const el=document.getElementById("mOut"); if(!el) return;
    const M={car:["110–140 бар","350–450 л/ч","бытовой класс, паузы каждые 20–30 минут"],
             yard:["130–150 бар","450–550 л/ч","бытовой класс, лучше с латунной головкой помпы"],
             big:["150–160 бар","550–650 л/ч","полупрофессиональный, помпа с керамическими поршнями"],
             pro:["от 160 бар","от 600 л/ч","профессиональный, индукционный двигатель"]}[v];
    el.innerHTML=`<span class="cn">Подбор мойки</span>Давление <b>${M[0]}</b> · расход <b>${M[1]}</b><br>
      Класс: ${M[2]}<br>
      <span style="font-size:13px;color:#B9BEC0">Давление отрывает грязь, расход её уносит. Для площадей литры важнее бар.
      Обязательно уточните, откуда вода: из бочки берут только модели с всасыванием.</span>`;
  };

  app.querySelectorAll("[data-air]").forEach(c=>c.onchange=air);
  app.querySelectorAll("[data-watt]").forEach(c=>c.onchange=watt);
  const bind=(id,fn)=>{ const e=document.getElementById(id); if(e){ e.oninput=fn; e.onchange=fn; } };
  bind("airSim",air); bind("wattMode",watt);
  bind("ampW",amp); bind("ampL",amp);
  bind("stepIn",rule);
  bind("areaIn",glue); bind("sizeIn",glue);
  bind("pArea",paint); bind("pType",paint); bind("pLayer",paint);
  bind("kType",kras); bind("kPnev",kras); bind("kArea",kras);
  bind("elIn",el_); bind("elLen",el_);
  bind("ushmIn",ushm); bind("mArea",moyka);
  kras(); el_(); ushm(); moyka();
}

function render(){
  let h="";
  if(S.tab==="ask"){
    if(!S.flow) h=viewList();
    else if(S.step < FLOWS[S.flow].qs.length) h=viewQuestion();
    else h=viewResult();
  }
  else if(S.tab==="quick") h=viewQuick();
  else if(S.tab==="calc") h=viewCalc();
  else if(S.tab==="ref") h=viewRef();
  else if(S.tab==="kits") h=viewKits();
  else h=viewMap();

  if(S.client && S.flow) h += viewClient();
  if(S.deep && S.flow) h += viewDeep();
  if(S.obj && S.flow) h += viewObj();
  if(S.kitOpen) h += viewKitSheet();
  app.innerHTML=h;

  const old=document.getElementById("kitbar"); if(old) old.remove();
  if(S.kit.length && !S.client && !S.deep && !S.obj){
    const bar=document.createElement("div");
    bar.id="kitbar";
    bar.innerHTML = `<div class="kc">Комплект <b>${S.kit.length}</b></div>
      <button class="clear" id="kitClear">Сбросить</button>
      <button id="kitShow">Список</button>`;
    document.body.appendChild(bar);
    document.getElementById("kitShow").onclick=()=>go({kitOpen:true});
    document.getElementById("kitClear").onclick=()=>go({kit:[],kitOpen:false});
  }
  document.body.style.overflow = (S.client||S.kitOpen||S.deep||S.obj) ? "hidden" : "";
  wire();
  if(S.tab==="calc") wireCalc();
}

function wireCards(){
  app.querySelectorAll("[data-flow]").forEach(b=>b.onclick=()=>{
    bumpUsage(b.dataset.flow);
    go({flow:b.dataset.flow,step:0,ans:[],close:[],addCode:false});
  });
  app.querySelectorAll("[data-ref]").forEach(b=>b.onclick=()=>{
    const id="ref:"+b.dataset.ref;
    if(S.tab!=="ref") selTab("ref");
    go({tab:"ref",open:S.open===id?null:id});
  });
  app.querySelectorAll("[data-kit]").forEach(b=>b.onclick=()=>{
    const id="kit:"+b.dataset.kit;
    if(S.tab!=="kits") selTab("kits");
    go({tab:"kits",open:S.open===id?null:id});
  });
}

function wire(){
  const q=document.getElementById("q");
  if(q){
    const upd = () => { S.q = q.value; const box=document.getElementById("results");
      if(box){ box.innerHTML = resultsHTML(); wireCards(); } };
    q.addEventListener("input", upd);
    q.addEventListener("keyup", upd);
    q.addEventListener("search", upd);
  }

  wireCards();

  const qqi=document.getElementById("qq");
  if(qqi){
    const upd=()=>{ S.qq=qqi.value;
      const box=document.getElementById("qres");
      if(box){
        const q=S.qq.trim().toLowerCase(), w=q.split(/\s+/).filter(Boolean);
        const list=q?QUICK.filter(x=>w.every(v=>(x[0]+" "+x[1]).toLowerCase().includes(v))):QUICK;
        box.innerHTML = list.length ? list.map(x=>`<div class="qa"><div class="qq">${esc(x[0])}</div><div class="qan">${esc(x[1])}</div></div>`).join("")
          : '<div class="note">Ничего не нашлось. Попробуйте другое слово или загляните в «Шпаргалки».</div>';
      }};
    qqi.addEventListener("input",upd); qqi.addEventListener("keyup",upd);
  }
  app.querySelectorAll("[data-shelf]").forEach(inp=>inp.oninput=e=>{
    store.set("shelf:"+inp.dataset.shelf, e.target.value);
  });
  app.querySelectorAll("[data-openaisle]").forEach(b=>b.onclick=()=>go({aisle:b.dataset.openaisle}));
  const ab=document.getElementById("aisleBack"); if(ab) ab.onclick=()=>go({aisle:null});
  app.querySelectorAll("[data-add]").forEach(el=>el.onclick=()=>{
    const v=el.dataset.add;
    const i=S.kit.indexOf(v);
    const kit=S.kit.slice();
    if(i>=0) kit.splice(i,1); else kit.push(v);
    go({kit});
  });
  app.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{
    const w=b.dataset.close;
    go(w==="client"?{client:false}:(w==="deep"?{deep:false}:(w==="obj"?{obj:false}:{kitOpen:false})));
  });
  app.querySelectorAll("[data-aisle]").forEach(b=>b.onclick=()=>{
    go({aisleQ: S.aisleQ===b.dataset.aisle ? "" : b.dataset.aisle});
  });
  const cb=document.getElementById("clientBtn"); if(cb) cb.onclick=()=>go({client:true});
  const db=document.getElementById("deepBtn"); if(db) db.onclick=()=>go({deep:true});
  const ob=document.getElementById("objBtn"); if(ob) ob.onclick=()=>go({obj:true});
  const cb2=document.getElementById("clientBtn2"); if(cb2) cb2.onclick=()=>go({client:true});
  const sb=document.getElementById("shortBtn");
  if(sb) sb.onclick=()=>{ const v=!S.short; store.set("short", v?"1":"0"); go({short:v}); };
  app.querySelectorAll("[data-close-i]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.closeI, list=S.close.slice(), p=list.indexOf(i);
    if(p>=0) list.splice(p,1); else list.push(i);
    go({close:list});
  });
  const cr=document.getElementById("careBtn");
  if(cr) cr.onclick=()=>{
    const txt=careFor(S.flow);
    const done=()=>{ const s=document.getElementById("careMsg");
      if(s){ s.textContent="Памятка скопирована — отправьте клиенту"; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent="",2600); } };
    if(navigator.share){ navigator.share({text:txt}).then(done).catch(()=>{
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(()=>{}); }); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done).catch(()=>{}); }
  };

  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const f=FLOWS[S.flow], i=+b.dataset.pick;
    const ans=S.ans.slice(0,S.step); ans[S.step]=f.qs[S.step].opts[i][1];
    go({ans,step:S.step+1});
  });
  const back=document.getElementById("back");
  if(back) back.onclick=()=>{ if(S.step===0) go({flow:null,ans:[],step:0}); else go({step:S.step-1}); };
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>go({step:0,ans:[]});
  const tl=document.getElementById("tolist"); if(tl) tl.onclick=()=>go({flow:null,step:0,ans:[]});

  app.querySelectorAll("[data-zone]").forEach(inp=>inp.oninput=e=>{
    store.set("aisle:"+inp.dataset.zone, e.target.value);
    const s=document.getElementById("saved"); if(s){ s.textContent="Сохранено"; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent="",1400); }
  });
  const nd=document.getElementById("netDot"), nt2=document.getElementById("netTxt");
  if(nd&&nt2){
    if(navigator.onLine){ nd.style.background="var(--ok)"; nt2.textContent="Связь есть — обновления доступны"; }
    else { nd.style.background="var(--tape)"; nt2.textContent="Без сети — работает из памяти телефона"; }
  }
  const ub=document.getElementById("updBtn");
  if(ub) ub.onclick=()=>{
    const s=document.getElementById("updMsg");
    if(!navigator.onLine){ if(s) s.textContent="Нет сети — включите интернет"; return; }
    if(s) s.textContent="Проверяю…";
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=>{
        Promise.all(rs.map(r=>r.update())).then(()=>{ setTimeout(()=>location.reload(true),900); });
      }).catch(()=>location.reload(true));
    } else location.reload(true);
  };

  const flash=(id,txt)=>{ const s=document.getElementById(id); if(s){ s.textContent=txt; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent="",2200); } };
  const copy=(txt,id,ok)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>flash(id,ok)).catch(()=>flash(id,"Не удалось скопировать"));
    } else {
      const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); flash(id,ok); }catch(e){ flash(id,"Не удалось"); }
      ta.remove();
    }
  };

  const cdA=document.getElementById("cdAdd");
  if(cdA) cdA.onclick=()=>go({addCode:true});
  const cdC=document.getElementById("cdCancel");
  if(cdC) cdC.onclick=()=>go({addCode:false});
  const cdS=document.getElementById("cdSave");
  if(cdS) cdS.onclick=()=>{
    const g=id=>((document.getElementById(id)||{}).value||"").trim();
    const n=g("cdName"), c=g("cdCode");
    if(!n||!c){ const m=document.getElementById("cdMsg"); if(m) m.textContent="Нужны название и код"; return; }
    const f=FLOWS[S.flow], r=f.out(S.ans);
    const list=getCodes();
    list.unshift({ id:"c"+Date.now(), f:S.flow, k:codeKey(S.flow,r.head), head:r.head,
                   cat:f.title, n:n, c:c, p:g("cdPrice"), note:g("cdNote"),
                   all:!!(document.getElementById("cdAll")||{}).checked });
    setCodes(list);
    go({addCode:false});
  };
  app.querySelectorAll("[data-delcode]").forEach(b=>b.onclick=()=>{
    setCodes(getCodes().filter(c=>c.id!==b.dataset.delcode)); render();
  });

  const qc=document.getElementById("quickCase");
  if(qc) qc.onclick=()=>{
    const f=FLOWS[S.flow], r=f.out(S.ans);
    const ans=f.qs.map((q,i)=>{ const o=q.opts.find(o=>o[1]===S.ans[i]); return o?o[0]:""; }).filter(Boolean);
    const d=new Date();
    const list=getCases();
    list.unshift({
      t: f.title + ": " + ans.join(", "),
      r: "Предложили: " + r.head + " (" + r.sub + ")."
         + (S.kit.length ? " Комплект: " + S.kit.join(", ") + "." : "")
         + " " + ("0"+d.getDate()).slice(-2) + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + d.getFullYear()
    });
    setCases(list);
    const s=document.getElementById("caseMsg");
    if(s){ s.textContent="Записано — правьте во вкладке «Моё»"; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent="",2600); }
  };

  const ca=document.getElementById("caseAdd");
  if(ca) ca.onclick=()=>{
    const t=(document.getElementById("caseT")||{}).value||"";
    const r=(document.getElementById("caseR")||{}).value||"";
    if(!t.trim()||!r.trim()) return;
    const list=getCases(); list.unshift({t:t.trim(),r:r.trim()}); setCases(list); render();
  };
  app.querySelectorAll("[data-delcase]").forEach(b=>b.onclick=()=>{
    const list=getCases(); list.splice(+b.dataset.delcase,1); setCases(list); render();
  });
  const eb=document.getElementById("expBtn");
  if(eb) eb.onclick=()=>copy(exportData(),"expMsg","Код скопирован — отправьте коллеге");
  const ib=document.getElementById("impBtn");
  if(ib) ib.onclick=()=>{
    const v=(document.getElementById("impIn")||{}).value||"";
    if(importData(v)){ flash("impMsg","Настройки загружены"); setTimeout(render,600); }
    else flash("impMsg","Код не распознан");
  };
  const kc=document.getElementById("kitCopy");
  if(kc) kc.onclick=()=>{
    const txt="Комплект:\n" + S.kit.map(x=>"— "+x).join("\n");
    if(navigator.share){ navigator.share({text:txt}).catch(()=>copy(txt,"kitMsg","Скопировано")); }
    else copy(txt,"kitMsg","Список скопирован");
  };

  const nt=document.getElementById("notes");
  if(nt) nt.oninput=e=>{ store.set("notes",e.target.value);
    const s=document.getElementById("saved2"); if(s){ s.textContent="Сохранено"; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent="",1400); } };
}


/* ============ КОД ДОСТУПА ============
   Чтобы сменить код — поменяйте цифры в строке ниже и загрузите файл заново.
   Это защита от случайного человека, а не от специалиста: код лежит в коде страницы. */
const ACCESS_CODE = "5050";

(function(){
  const gate=document.getElementById("gate");
  const inp=document.getElementById("gateInput");
  const err=document.getElementById("gateErr");
  if(store.get("unlocked")==="ok"){ gate.remove(); return; }
  document.body.style.overflow="hidden";
  const open=()=>{ store.set("unlocked","ok"); gate.remove(); document.body.style.overflow=""; };
  const check=()=>{
    if(inp.value.trim()===ACCESS_CODE) open();
    else { err.textContent="Неверный код"; inp.value=""; setTimeout(()=>err.textContent="",1800); }
  };
  document.getElementById("gateBtn").onclick=check;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
  setTimeout(()=>inp.focus(),200);
})();

render();

</script>

<script>
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById("installBtn");
  if(b){ b.style.display="block"; b.onclick=async()=>{ b.style.display="none"; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }; }
});
window.addEventListener("appinstalled",()=>{ const b=document.getElementById("installBtn"); if(b) b.style.display="none"; });
</script>
</body>
